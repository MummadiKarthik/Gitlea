 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container{
            display: flex;
            justify-content: center;        
            align-items: center;

        }
        .ai-search {
            position: relative;
            padding: 5px;
            overflow: hidden;
            width:410px;
            height:60px;
            background-color:black;
            display: flex;
            justify-content: center;    
            align-items: center;
            border-radius: 30px;
            z-index: 1;

        }
        .ai-search::before {
            content: '';
            display:none;
            position: absolute;
            top: 0;
            left: 0;
            width: 450px;
            height: 450px;
            background: linear-gradient(45deg, red, green, blue, yellow,orange);
         }
         .ai-search:hover::before {
            display:block;
            animation: rotate 3s linear infinite;
         }
         .ai-search-button {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
         }
         @keyframes rotate {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
         }

    </style>
</head>
<body>
    <div class="container">
        <div class="ai-search">
            <button class="ai-search-button">Open AI Search</button>
        </div>
    </div>

    
    
</body>
</html>
